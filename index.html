:root{
  --bg:#101116;--bg2:#1C1E26;--surface:#252832;--text:#fff;--muted:#A6ABB8;--accent:#B7FF00;--accent-ink:#101116;--alert:#FF3864;
  --line:rgba(255,255,255,.1);--field:#14151B;
  --r-card:22px;--r-ctl:14px;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--lft:env(safe-area-inset-left,0px);--rgt:env(safe-area-inset-right,0px);
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--num:"Big Shoulders",Impact,"Arial Narrow",sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{--line:rgba(16,17,22,.13);--field:#EDEEF2;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;font-weight:500;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 14px) calc(var(--rgt) + 16px) 28px calc(var(--lft) + 16px)}
#view>*{max-width:1120px;margin-inline:auto}
body.layered #app{visibility:hidden}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--num);font-weight:900;font-size:40px;line-height:1;letter-spacing:.005em}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-ctl);font-weight:700;white-space:nowrap}
.btn .ic{width:19px;height:19px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--text)}
:root[data-theme=light] .btn.ghost{background:#E3E5EB}
.btn.danger{background:var(--alert);color:#101116}
.btn.danger-ghost{background:transparent;color:var(--alert);box-shadow:inset 0 0 0 2px var(--alert)}
.btn:active,.ib:active{transform:scale(.97)}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--text);flex:none}
.ib.fav{color:var(--muted)}
.ib.fav.on{color:#FF9500}
.ib.fav.on .ic{fill:currentColor}
.row-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row-end{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}

/* Recherche et filtres */
.tools{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:0 14px;height:46px;border-radius:var(--r-ctl);background:var(--bg2);color:var(--muted);min-width:0}
:root[data-theme=light] .search{background:#fff}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);height:100%}
.tools select{flex:none;width:128px}
select,input[type=text],input[type=search]{-webkit-appearance:none;appearance:none}
select,.field input[type=text]{width:100%;height:46px;border:0;border-radius:var(--r-ctl);padding:0 14px;background:var(--field);color:var(--text)}
.tools select{background-color:var(--bg2)}
:root[data-theme=light] .tools select{background-color:#fff}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.segs{display:flex;gap:4px;background:var(--bg2);border-radius:var(--r-ctl);padding:4px;margin-bottom:10px}
:root[data-theme=light] .segs{background:#E3E5EB}
.seg{flex:1;min-height:38px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px}
.seg.on{background:var(--text);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:18px;font-size:15px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.on{color:var(--text);box-shadow:inset 0 0 0 2px var(--text)}

/* Cartes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.card{background:var(--bg2);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-top{display:flex;align-items:center;gap:10px}
.tile{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;flex:none}
.card-title{flex:1;min-width:0}
.card-title h3{font-size:19px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title p{color:var(--muted);font-size:14px}
.card-top .ib{width:40px;height:40px}
.card-desc{color:var(--muted);font-size:15px}
.strip{height:10px;border-radius:5px;background:var(--surface)}
.card-foot{display:flex;align-items:center;gap:8px}
.card-foot .ib.edit{background:var(--surface);width:46px;height:46px;border-radius:var(--r-ctl)}
:root[data-theme=light] .card-foot .ib.edit{background:#E3E5EB}
.card-dur{font-family:var(--num);font-weight:900;font-size:38px;line-height:1;margin-right:auto}
.empty{text-align:center;padding:48px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty p{max-width:34ch}

/* Navigation */
#nav{display:flex;background:var(--bg2);padding:6px calc(var(--rgt) + 8px) calc(var(--bot) + 6px) calc(var(--lft) + 8px)}
:root[data-theme=light] #nav{background:#fff}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;border-radius:12px}
.nav-item.on{color:var(--text)}
.nav-item.on .ic{color:var(--accent)}
:root[data-theme=light] .nav-item.on .ic{color:var(--text)}
#mini{display:flex;align-items:center;gap:6px;background:var(--surface);padding:6px 10px 6px 16px}
:root[data-theme=light] #mini{background:#E3E5EB}
.mini-open{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;min-width:0;text-align:left}
.mini-dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--accent)}
.mini-name{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-time{font-family:var(--num);font-weight:900;font-size:28px}

/* Fenêtres */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,5,8,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:88dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:var(--bot)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 4px 20px}
.sheet-head h2{font-size:22px;font-weight:700;line-height:1.2}
.sheet-body{overflow-y:auto;padding:6px 20px 20px}
.lead{color:var(--muted);line-height:1.5}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:24px}}
.menu{display:flex;flex-direction:column}
.menu-item{display:flex;align-items:center;gap:14px;min-height:52px;font-weight:600;text-align:left;border-radius:12px;padding:0 6px}
.menu-item.danger{color:var(--alert)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--surface);font-weight:600;text-align:left;line-height:1.15;min-height:66px}
:root[data-theme=light] .cat{background:var(--bg)}
.report{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
#toasts{position:fixed;z-index:80;left:0;right:0;bottom:calc(var(--bot) + 84px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;max-width:440px}
.toast.bad{background:var(--alert);color:#101116}

/* Vues plein écran */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 8px) calc(var(--rgt) + 12px) 8px calc(var(--lft) + 8px);background:var(--bg)}
.bar h2{flex:1;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;padding:4px calc(var(--rgt) + 16px) 24px calc(var(--lft) + 16px)}
.scroll>*{max-width:640px;margin-inline:auto}
.summary{background:var(--bg2);padding:10px calc(var(--rgt) + 16px) calc(var(--bot) + 10px) calc(var(--lft) + 16px)}
:root[data-theme=light] .summary{background:#fff}
.summary>*{max-width:640px;margin-inline:auto}
.sum-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;margin-bottom:8px}
.sum-total{font-family:var(--num);font-weight:900;font-size:36px;line-height:1}
.sum-info{grid-row:2;grid-column:1;min-width:0;color:var(--muted);font-size:14px;line-height:1.2}
.sum-line .btn{grid-row:1/3;grid-column:2}

/* Formulaires */
.group{background:var(--bg2);border-radius:var(--r-card);padding:14px;margin-bottom:12px;max-width:640px}
:root[data-theme=light] .group,:root[data-theme=light] .card,:root[data-theme=light] .fold{background:#fff}
#view>.group{max-width:760px}
.group>h3{font-size:21px;font-family:var(--num);font-weight:700;margin-bottom:8px;letter-spacing:.01em}
.group h4{font-size:16px;font-weight:700;margin:14px 0 2px}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.lbl{font-weight:600}
.hint{color:var(--muted);font-size:14px;line-height:1.3}
.hint-block{color:var(--muted);font-size:15px;line-height:1.45;max-width:64ch}
.warn{color:var(--alert);font-weight:600;margin:8px 0}
.field-err{color:var(--alert);font-weight:600;font-size:15px}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.stepper-row .lbl{min-width:0}
.stepper{display:flex;align-items:center;background:var(--field);border-radius:var(--r-ctl);flex:none}
.stepper .ib{width:46px;height:46px}
.stepper-val{width:78px;height:46px;border:0;background:none;text-align:center;font-family:var(--num);font-weight:700;font-size:25px;outline-offset:-2px}
.toggle{display:flex;align-items:center;gap:12px;min-height:54px;cursor:pointer;position:relative}
.toggle-text{flex:1;min-width:0;display:flex;flex-direction:column}
.toggle input{position:absolute;opacity:0;width:52px;height:32px;right:0;margin:0;cursor:pointer}
.toggle i{width:52px;height:32px;border-radius:16px;background:var(--surface);position:relative;flex:none;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .15s}
.toggle i::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle input:checked+i{background:var(--accent)}
.toggle input:checked+i::after{transform:translateX(20px);background:var(--accent-ink)}
.toggle input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.swatch.on{outline:3px solid var(--text);outline-offset:2px}
.swatch.custom{position:relative;overflow:hidden;background:conic-gradient(#FF3864,#FF9500,#B7FF00,#00C8FF,#A855F7,#FF3864)}
.swatch.custom input{position:absolute;inset:-8px;opacity:0;width:60px;height:60px;cursor:pointer}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icon-opt{display:grid;place-items:center;height:44px;border-radius:12px;background:var(--field);color:var(--muted)}
.icon-opt.on{background:var(--text);color:var(--bg)}
.sound-pick{display:flex;gap:8px}
.sound-pick select{flex:1;min-width:0}
.sound-pick .ib{background:var(--surface);width:46px;height:46px}
:root[data-theme=light] .sound-pick .ib{background:#E3E5EB}
.fold{background:var(--bg2);border-radius:var(--r-card);margin-bottom:12px;max-width:640px}
.group .fold{background:var(--field);border-radius:var(--r-ctl);margin:8px 0}
.fold summary,.event summary,.phase summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.fold summary::-webkit-details-marker,.event summary::-webkit-details-marker,.phase summary::-webkit-details-marker{display:none}
.fold>summary{min-height:54px;padding:0 14px;font-weight:700;justify-content:space-between}
details[open]>summary>.ic:last-child{transform:rotate(180deg)}
.fold-body{padding:0 14px 14px}
.event,.phase{background:var(--field);border-radius:var(--r-ctl);margin-bottom:8px}
.group .fold .event{background:var(--surface)}
:root[data-theme=light] .group .fold .event{background:#fff}
.event summary{padding:10px 14px;min-height:56px;justify-content:space-between}
.event-sum{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.event-sum span{color:var(--muted);font-size:15px}
.event-form,.phase-form{padding:0 14px 12px}
.event select,.phase select,.event .field input[type=text],.phase .field input[type=text],.event .stepper,.phase .stepper{background-color:var(--surface)}
:root[data-theme=light] .event select,:root[data-theme=light] .phase select,:root[data-theme=light] .event .field input[type=text],:root[data-theme=light] .phase .field input[type=text],:root[data-theme=light] .event .stepper,:root[data-theme=light] .phase .stepper{background-color:#fff}
.phase summary{padding:0 12px;min-height:54px}
.phase-dot{width:16px;height:16px;border-radius:5px;flex:none}
.phase-name{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase-dur{font-family:var(--num);font-weight:700;font-size:22px}
.item-tools{display:flex;justify-content:flex-end}
.item-tools .ib{width:40px;height:40px;color:var(--muted)}
.item{margin-bottom:6px}
.item.loop{box-shadow:inset 3px 0 0 var(--accent);padding:6px 0 6px 12px;border-radius:4px;margin-bottom:12px}
.loop-head{display:flex;align-items:center;gap:10px}
.loop-head .stepper-row{flex:1}
.loop-items{margin-top:6px}
.builder .row-wrap .btn{flex:1 1 auto}

/* Réglages */
.range-row{display:flex;align-items:center;gap:12px;min-height:50px}
.range-row .lbl{flex:0 0 auto;min-width:72px}
.range-row input,.sound-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:30px}
.range-v{width:52px;text-align:right;color:var(--muted);font-size:15px}
.sound-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sound-row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(84px,120px);align-items:center;gap:10px;min-height:62px}
.ib.round{background:var(--surface);border-radius:50%}
:root[data-theme=light] .ib.round{background:#E3E5EB}
.sound-text{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.sound-text span{color:var(--muted);font-size:14px}
.sound-extra{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.mini-btn{font-size:14px;font-weight:700;min-height:36px;padding:0 10px;border-radius:9px;background:var(--surface)}
.mini-btn.on{background:var(--accent);color:var(--accent-ink)}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 16px}
.color-row{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:10px}
.color-row input{width:46px;height:34px;padding:0;border:0;background:none;border-radius:8px}
.caps{display:flex;flex-direction:column}
.cap{display:flex;align-items:center;gap:10px;min-height:38px}
.cap>span:nth-child(2){flex:1}
.cap-v{color:var(--muted);font-size:15px}
.cap-dot{width:10px;height:10px;border-radius:50%}
.cap-dot.ok{background:#3DDC84}
.cap-dot.no{background:var(--muted)}

/* Historique */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--bg2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column}
:root[data-theme=light] .stat{background:#fff}
.stat strong{font-family:var(--num);font-weight:900;font-size:36px;line-height:1.05}
.stat span{color:var(--muted);font-size:15px}
#view>.group{margin-inline:auto}
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;height:170px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0;height:100%}
.bar-v{display:block;width:min(70%,34px);background:var(--muted);border-radius:4px 4px 0 0;flex:none;max-height:calc(100% - 24px)}
.col.now .bar-v{background:var(--accent)}
.col:hover .bar-v,.col:focus-visible .bar-v{filter:brightness(1.15)}
.col-l{font-size:12px;color:var(--muted);white-space:nowrap;line-height:18px;height:18px;flex:none}
.chart-read{margin-top:8px;font-weight:600}
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:center;min-height:62px;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-main{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.hist-main strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-main span,.hist-vals span:last-child{color:var(--muted);font-size:14px}
.hist-vals{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;text-align:right}
.hist-vals span:first-child{font-weight:700}
.hist-row .ib{color:var(--muted)}

/* Multitimer */
.multi-all{margin:0 auto 12px}
.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mt{--mc:var(--surface);--mi:var(--text);background:var(--mc);color:var(--mi);border-radius:var(--r-card);padding:12px 14px;display:flex;flex-direction:column;transition:background .25s}
.mt-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt-head h3{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .ib{color:inherit}
.mt-time{font-family:var(--num);font-weight:900;font-size:74px;line-height:1;font-variant-numeric:tabular-nums}
.mt-sub{font-weight:600;min-height:22px}
.mt-ctl{display:flex;align-items:center;gap:6px;margin-top:8px}
.mt-play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#101116;color:#fff}
.mt-play .ic{fill:currentColor}

/* Écran de séance */
.runner{background:#000;overflow:hidden;outline:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage{position:absolute;inset:0;--ph:#333;--ph-ink:#fff;--ph-dim:#222;--ph-dimink:#fff;--pg:0;--dg:120px}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:stretch;padding:calc(var(--top) + 64px) calc(var(--rgt) + 16px) calc(var(--bot) + 178px) calc(var(--lft) + 16px);transition:background-color .22s linear,color .22s linear}
.face.back{background:var(--ph-dim);color:var(--ph-dimink)}
.face.front{background:var(--ph);color:var(--ph-ink);will-change:clip-path}
.f-top{display:flex;align-items:baseline;justify-content:center;gap:18px;font-family:var(--num);font-weight:900;font-size:min(var(--tf,999px),clamp(30px,6vh,60px));line-height:1;text-transform:uppercase;letter-spacing:.015em;white-space:nowrap}
.f-series{opacity:.8}
.digits{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:900;font-size:var(--dg);line-height:1;white-space:nowrap;overflow:hidden}
.digits span{display:inline-block;text-align:center}
.digits .d{width:.5em;transform:translateY(-.03em)}
.digits .c{width:.27em;transform:translateY(-.06em)}
.digits .dot{width:.2em}
.digits.stack{display:grid;grid-template-columns:repeat(2,.5em);grid-auto-rows:.86em;justify-content:center;align-content:center}
.digits.stack .c{display:none}
.digits.stack span{line-height:.86em;transform:none}
.digits .sm{width:.31em;font-size:.6em;width:.517em;align-self:center;transform:translateY(.17em)}
.f-phase{font-family:var(--num);font-weight:900;font-size:min(var(--pf,999px),clamp(44px,10vh,104px));line-height:1.04;text-align:center;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.f-info{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:clamp(16px,2.6vh,22px);margin-top:12px;line-height:1.2}
.f-next{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.f-remain{flex:none;font-variant-numeric:tabular-nums}
.f-bar{height:10px;border-radius:5px;margin-top:10px;background:color-mix(in srgb,currentColor 24%,transparent);overflow:hidden;flex:none}
.f-bar i{display:block;height:100%;background:currentColor;border-radius:5px;transform-origin:left;transform:scaleX(var(--pg))}
.r-bar{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:calc(var(--top) + 8px) calc(var(--rgt) + 10px) 0 calc(var(--lft) + 10px)}
.r-bar .ib{background:rgba(0,0,0,.62);color:#fff;border-radius:50%}
.r-name{flex:1;min-width:0;text-align:center;font-weight:700;color:#fff;background:rgba(0,0,0,.62);border-radius:22px;padding:0 14px;height:34px;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:fit-content;max-width:max-content;margin-inline:auto}
.r-controls{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 calc(var(--rgt) + 16px) calc(var(--bot) + 12px) calc(var(--lft) + 16px);display:flex;flex-direction:column;gap:10px;align-items:center;transition:opacity .25s}
.r-extra{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px}
.r-chip.btn{background:rgba(0,0,0,.72);color:#fff;min-height:44px;padding:0 14px}
.r-chip.strong{background:#fff;color:#101116;font-size:18px;padding:0 22px}
.r-row{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.4vw,10px);width:100%}
.r-ib.ib{width:clamp(44px,14vw,56px);height:clamp(44px,14vw,56px);border-radius:50%;background:rgba(0,0,0,.72);color:#fff;flex:none}
.r-main{width:clamp(72px,23vw,92px);height:clamp(72px,23vw,92px);flex:none;border-radius:50%;background:#101116;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.r-main .ic{width:38px;height:38px;fill:currentColor}
.r-pill.btn{background:#101116;color:#fff;min-height:64px;padding:0 24px;font-size:18px;border-radius:32px;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.r-banner{position:absolute;z-index:4;left:50%;top:calc(var(--top) + 70px);transform:translateX(-50%);max-width:92%;background:#101116;color:#fff;font-family:var(--num);font-weight:900;font-size:clamp(30px,7vw,64px);line-height:1.05;padding:10px 22px;border-radius:18px;text-align:center}
.r-gate{position:absolute;z-index:5;left:50%;bottom:calc(var(--bot) + 190px);transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap;background:#fff;color:#101116;font-weight:700;padding:11px 16px;border-radius:24px}
.r-flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 clamp(12px,4vmin,34px) var(--alert)}
.r-flash.go{animation:ringflash .55s ease-out}
@keyframes ringflash{0%{opacity:1}100%{opacity:0}}
.runner.giant .f-info{display:none}
.runner.giant .f-bar{height:14px;margin-top:8px}
.runner.giant .face{padding-bottom:calc(var(--bot) + 120px)}
.runner.giant .r-extra{display:none}
.runner.giant .r-main{width:72px;height:72px}
.runner.giant.hide-ctl .r-controls,.runner.giant.hide-ctl .r-bar{opacity:0;pointer-events:none}
.runner.giant.hide-ctl .face{padding:calc(var(--top) + 12px) calc(var(--rgt) + 14px) calc(var(--bot) + 12px) calc(var(--lft) + 14px)}
.r-bar{transition:opacity .25s}

@media (orientation:landscape) and (max-height:560px){
  .face{padding:calc(var(--top) + 10px) calc(var(--rgt) + 104px) calc(var(--bot) + 10px) calc(var(--lft) + 68px)}
  .runner.giant .face,.runner.giant.hide-ctl .face{padding:calc(var(--top) + 8px) calc(var(--rgt) + 96px) calc(var(--bot) + 8px) calc(var(--lft) + 68px)}
  .runner.giant.hide-ctl .face{padding-inline:calc(var(--lft) + 14px) calc(var(--rgt) + 14px)}
  .f-top{font-size:min(var(--tf,999px),26px);justify-content:flex-start}
  .f-phase{font-size:min(var(--pf,999px),40px);text-align:left}
  .f-info{margin-top:4px;font-size:16px}
  .f-bar{margin-top:6px;height:8px}
  .r-name{display:none}
  .r-bar{right:auto;bottom:0;flex-direction:column;align-items:flex-start;padding:calc(var(--top) + 8px) 0 calc(var(--bot) + 8px) calc(var(--lft) + 10px);justify-content:flex-start}
  .r-controls{left:auto;top:0;width:auto;padding:calc(var(--top) + 6px) calc(var(--rgt) + 10px) calc(var(--bot) + 6px) 0;justify-content:center}
  .r-extra{display:none}
  .r-row{flex-direction:column-reverse;gap:4px}
  .r-ib.ib{width:44px;height:44px}
  .r-main,.runner.giant .r-main{width:72px;height:72px}
  .r-pill.btn{min-height:50px;padding:0 16px;font-size:16px}
  .r-gate{bottom:calc(var(--bot) + 12px)}
  #view{padding-top:calc(var(--top) + 8px)}
}
@media (max-width:360px){
  .card-dur{font-size:32px}
  .card-foot .btn .ic{display:none}
  .card-foot .btn{padding:0 14px}
}
@media (min-width:900px) and (min-height:561px){
  .r-ib.ib{width:56px;height:56px}
  .r-main{width:92px;height:92px}
  .face{padding-left:7vw;padding-right:7vw}
  .r-controls{gap:12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .r-flash.go{animation-duration:.01s}
}

</style>

/* ==========================================================================
   MOTEUR — TIMER → PHASES → RÉPÉTITIONS → ÉVÉNEMENTS → ACTIONS
   Aucune dépendance au DOM : le temps n'est jamais compté, il est calculé
   à partir d'horodatages. L'affichage ne fait que lire l'état du moteur.
   ========================================================================== */
/*ENGINE-START*/
const LATE_MS = 1500;          // au-delà, un repère manqué n'est plus joué
const OPEN_HORIZON = 6 * 3600 * 1000;
const MAX_STEPS = 5000;
const MAX_CUES = 40000;

/* Horloge monotone corrigée de la mise en veille.
   performance.now() peut s'arrêter pendant la veille : l'écart avec Date.now()
   est réinjecté, ce qui permet de retrouver le bon temps au retour. */
function makeClock(perf, wall) {
  let off = 0, lastPerf = perf(), lastWall = wall();
  return {
    now() {
      const p = perf(), w = wall();
      const drift = (w - lastWall) - (p - lastPerf);
      if (drift > 1000) off += drift;
      lastPerf = p; lastWall = w;
      return p + off;
    }
  };
}

const PHASE_KINDS = ['prep', 'work', 'rest', 'longrest', 'custom', 'open'];

const sec = v => Math.max(0, Number(v) || 0);

function makeStep(o) {
  return Object.assign({
    name: '', kind: 'work', ms: 0, color: null, round: 0, totalRounds: 0, series: 0, totalSeries: 0,
    exercise: '', startSound: undefined, endSound: undefined, voice: undefined, voiceKey: undefined,
    events: [], countdown: 3
  }, o);
}

/* Noms par défaut des phases, indépendants de la langue des annonces */
const PHASE_LABEL = { prep: 'Préparation', work: 'Travail', rest: 'Repos', longrest: 'Repos long', custom: 'Phase', open: 'Chrono' };

/* Compile un minuteur (quel que soit son mode) en programme linéaire d'étapes */
function compileSteps(t) {
  const p = t.params || {}, steps = [];
  const push = o => {
    if (steps.length >= MAX_STEPS) throw new Error('Séance trop longue : plus de ' + MAX_STEPS + ' phases.');
    steps.push(makeStep(o));
  };
  const prep = (extra) => {
    if (sec(p.prep) > 0) push(Object.assign({ name: PHASE_LABEL.prep, kind: 'prep', ms: sec(p.prep) * 1000, voiceKey: 'prep' }, extra));
  };
  switch (t.mode) {
    case 'countdown':
      prep({});
      push({ name: t.name || 'Minuteur', kind: 'work', ms: sec(p.duration) * 1000, voiceKey: 'go' });
      break;
    case 'stopwatch':
      prep({});
      push({ name: 'Chrono', kind: 'open', ms: Infinity, countdown: 0, voiceKey: 'go' });
      break;
    case 'amrap':
      prep({});
      push({ name: 'AMRAP', kind: 'work', ms: sec(p.duration) * 1000, voiceKey: 'go', countdown: 3 });
      break;
    case 'emom': {
      const n = Math.max(1, Math.round(p.minutes) || 1), iv = sec(p.interval) || 60;
      prep({ round: 1, totalRounds: n });
      for (let r = 1; r <= n; r++) push({ name: 'Minute ' + r, kind: 'work', ms: iv * 1000, round: r, totalRounds: n, voiceKey: 'round' });
      break;
    }
    case 'interval': {
      const R = Math.max(1, Math.round(p.rounds) || 1), S = Math.max(1, Math.round(p.sets) || 1);
      const cdn = p.countdown === false ? 0 : 3;
      prep({ round: 1, totalRounds: R, series: 1, totalSeries: S });
      for (let s = 1; s <= S; s++) {
        for (let r = 1; r <= R; r++) {
          push({ name: p.workLabel || PHASE_LABEL.work, kind: 'work', ms: sec(p.work) * 1000, round: r, totalRounds: R, series: s, totalSeries: S, voiceKey: 'work', countdown: cdn });
          const last = r === R;
          if (sec(p.rest) > 0 && (!last || p.restAfterLast))
            push({ name: p.restLabel || PHASE_LABEL.rest, kind: 'rest', ms: sec(p.rest) * 1000, round: r, totalRounds: R, series: s, totalSeries: S, voiceKey: 'rest', countdown: cdn });
        }
        if (s < S && sec(p.setRest) > 0)
          push({ name: PHASE_LABEL.longrest, kind: 'longrest', ms: sec(p.setRest) * 1000, round: R, totalRounds: R, series: s, totalSeries: S, voiceKey: 'longrest', countdown: cdn });
      }
      if (sec(p.cooldown) > 0)
        push({ name: 'Retour au calme', kind: 'rest', ms: sec(p.cooldown) * 1000, round: R, totalRounds: R, series: S, totalSeries: S, voiceKey: 'rest', countdown: cdn });
      break;
    }
    case 'combat': {
      const R = Math.max(1, Math.round(p.rounds) || 1);
      const fight = p.fightLabel || 'Combat';
      const voice = p.announce === false ? '' : undefined;
      prep({ round: 1, totalRounds: R, startSound: 'none' });
      for (let r = 1; r <= R; r++) {
        push({ name: fight, kind: 'work', ms: sec(p.round) * 1000, round: r, totalRounds: R, startSound: p.startSound || 'gong', endSound: p.endSound || 'gong', voice, voiceKey: 'round', countdown: 0 });
        if (r < R && sec(p.rest) > 0)
          push({ name: PHASE_LABEL.rest, kind: 'rest', ms: sec(p.rest) * 1000, round: r, totalRounds: R, startSound: 'none', voiceKey: 'rest', countdown: 3 });
      }
      break;
    }
    case 'custom': walkItems(p.items || [], {}, push, 0); break;
    default: throw new Error('Mode inconnu : ' + t.mode);
  }
  return steps;
}

function walkItems(items, ctx, push, depth) {
  if (depth > 6) throw new Error('Trop de boucles imbriquées.');
  (items || []).forEach(it => {
    if (it.type === 'loop') {
      const n = Math.max(1, Math.round(it.repeat) || 1);
      const body = it.items || [];
      const lastRest = it.skipLastRest && body.length > 1 && body[body.length - 1].type !== 'loop' &&
        ['rest', 'longrest'].includes(body[body.length - 1].kind);
      for (let i = 1; i <= n; i++) {
        const next = { round: i, totalRounds: n, series: ctx.round || 0, totalSeries: ctx.totalRounds || 0 };
        walkItems(i === n && lastRest ? body.slice(0, -1) : body, next, push, depth + 1);

    const seeded = await DB.get('kv', 'seeded');
    if (!seeded) {
      for (const p of presetList()) { App.timers.push(p); await DB.put('timers', p); }
      await DB.put('kv', { key: 'seeded', value: 1 });
    }
    App.history = [];
    (await DB.all('history')).forEach(r => { try { App.history.push(sanitizeHistory(r)); } catch (e) {} });
    Sound.user = (await DB.all('sounds')).filter(u => u && u.data);
  } catch (e) {
    if (!App.timers.length) App.timers = presetList();
    toast('Stockage local indisponible : les changements ne seront pas conservés.', 'bad');
  }
  const unlock = () => { Sound.unlock(); Speech.unlock(); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); };
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(n => document.addEventListener(n, unlock, { capture: true, passive: true }));
  document.addEventListener('tp-audio', () => { if (App.view === 'settings' && !Layers.stack.length && !$('#modals').children.length) { const a = document.activeElement; if (!a || !a.matches('input,select,textarea')) renderView(); } });
  document.addEventListener('tp-history', () => { if (App.view === 'history' && !Layers.stack.length) renderView(); });
  Sessions.subs.add((s, type, d) => {
    if (type === 'state' || type === 'finished') renderMini();
    if (type !== 'finished') return;
    if (s.multi && d.status === 'completed') toast(s.timer.name + ' : terminé');
    const runnerOpen = openRunnerState.current && openRunnerState.current.session === s;
    if (!s.multi && !runnerOpen) { if (d.status === 'completed') toast(s.timer.name + ' : séance terminée'); Sessions.remove(s); renderMini(); }
  });
  const restored = Sessions.restore();
  Ticker.start();
  const hash = location.hash.replace('#', '');
  if (NAV.some(n => n[0] === hash)) App.view = hash;
  renderView();
  requestAnimationFrame(uiFrame);
  const main = restored.find(s => !s.multi);
  if (main) { openRunner(main); toast('Séance reprise : le temps écoulé a été recalculé.'); }
  else if (restored.some(s => s.engine.state === 'running')) toast('Minuteurs repris. Touchez l\'écran pour réactiver le son.');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('hashchange', () => {
  const v = location.hash.replace('#', '') || 'library';
  if (NAV.some(n => n[0] === v) && v !== App.view) { App.view = v; renderView(); }
});
boot();


</script>
